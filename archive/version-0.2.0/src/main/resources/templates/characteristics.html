<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traveller Characteristics</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
<main class="panel">
  <p class="eyebrow">Step 2 of 3</p>
  <h1>Characteristics</h1>
  <p class="lede"><strong th:text="${character.name}">Character</strong>, age <span th:text="${character.age}">18</span>. Keep these rolls or roll all six again.</p>
  <form th:action="@{/characteristics}" th:object="${character}" method="post" novalidate>
    <input type="hidden" th:field="*{name}">
    <input type="hidden" th:field="*{age}">
    <div class="stats">
      <label>Strength<input type="number" th:field="*{characteristics.strength}" min="2" max="12"></label>
      <label>Dexterity<input type="number" th:field="*{characteristics.dexterity}" min="2" max="12"></label>
      <label>Endurance<input type="number" th:field="*{characteristics.endurance}" min="2" max="12"></label>
      <label>Intelligence<input type="number" th:field="*{characteristics.intelligence}" min="2" max="12"></label>
      <label>Education<input type="number" th:field="*{characteristics.education}" min="2" max="12"></label>
      <label>Social standing<input type="number" th:field="*{characteristics.socialStanding}" min="2" max="12"></label>
    </div>
    <div class="error-box" th:if="${#fields.hasAnyErrors()}">
      <p>Please correct the highlighted values.</p>
      <ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul>
    </div>
    <p class="upp">UPP <strong th:text="*{characteristics.upp}">777777</strong></p>
    <div class="actions">
      <button type="submit" name="action" value="reroll">Roll again</button>
      <button class="primary" type="submit" name="action" value="continue">Choose a service</button>
    </div>
  </form>
</main>
</body>
</html>
