<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Traveller Character</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
<main class="panel narrow">
  <p class="eyebrow">Classic Traveller</p>
  <h1>Create a character</h1>
  <p class="lede">Name your traveller and choose a starting age. Characteristics are rolled on the next step.</p>
  <form th:action="@{/newcharacter}" th:object="${character}" method="post" novalidate>
    <label for="name">Character name</label>
    <input id="name" type="text" th:field="*{name}" maxlength="80" autofocus>
    <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

    <label for="age">Starting age</label>
    <input id="age" type="number" th:field="*{age}" min="18" max="100">
    <p class="error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></p>

    <button class="primary" type="submit">Roll characteristics</button>
  </form>
</main>
</body>
</html>
