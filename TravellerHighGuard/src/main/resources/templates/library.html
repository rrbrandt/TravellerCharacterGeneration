<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>High Guard · Saved ships</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header><a class="brand" th:href="@{/}">TRAVELLER <span>BOOK 5</span></a><nav><a th:href="@{/}">← Designer</a><a th:href="@{/import}">Import Book 2</a><a th:href="${portalUrl}">Main portal</a></nav></header><main><div class="eyebrow">THE HIGH GUARD LIBRARY</div><h1>Ships built<br><em>for a purpose.</em></h1><p><span th:text="${storageNotice}"></span> Original Book 2 ships remain in their own library.</p><section class="cards"><article class="panel" th:each="s:${ships}"><div class="eyebrow" th:text="${s.design.hull+' TONS / TL'+s.design.tl}"></div><h2 th:text="${s.design.name}"></h2><p th:text="${s.design.shipClass}"></p><p th:text="${'J'+s.design.jump+' / '+s.design.maneuver+'G / P'+s.design.power}"></p><p class="hint" th:text="${s.savedAt}"></p><a class="button" th:href="@{/(id=${s.design.id})}">Open ship →</a><a th:href="@{/ships/{id}.json(id=${s.design.id})}">Download JSON</a></article></section><p th:if="${ships.empty}">No High Guard ships saved yet. Start a design or import a Book 2 ship.</p></main></body></html>
