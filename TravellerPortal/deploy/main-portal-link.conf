# Apply only inside Traveller application proxy locations, not the portal/account.
# Keep app sessions intact: navigation is injected without restarting Java services.
proxy_set_header Accept-Encoding "";
sub_filter_once on;
sub_filter '</header>' '<a class="portal-return" data-portal-link="true" href="/" style="display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid #627086;border-radius:4px;color:#edb66a;font:12px system-ui;white-space:nowrap;text-decoration:none"><span aria-hidden="true">&#8592;</span> Main portal</a></header>';
