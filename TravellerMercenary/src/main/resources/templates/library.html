<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved soldiers · Mercenary</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header><div class="brand">TRAVELLER <span>BOOK 4</span></div><nav><a th:href="@{/}">← Career generator</a><a th:href="${portalUrl}">Main portal</a></nav></header><main><div class="eyebrow">SAVED SERVICE RECORDS</div><h1>Soldiers with a story.</h1><p>Open a record to resume exactly where you left it.</p><section class="cards"><article class="panel" th:each="s:${saved}"><div class="eyebrow" th:text="${s.phase}"></div><h2 th:text="${s.name}"></h2><p th:text="${s.service+' / '+s.arm}"></p><p th:text="${s.rankName+' · Age '+s.age+' · '+s.years+' years'}"></p><strong class="mono" th:text="${s.upp}"></strong><form method="post" th:action="@{/open}"><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="revision" th:value="${revision}"><input type="hidden" name="id" th:value="${s.id}"><button>Open record →</button></form></article></section><p th:if="${saved.empty}">No saved soldiers yet. Start a recruit and make your first roll.</p></main></body></html>
